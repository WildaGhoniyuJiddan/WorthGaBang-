<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
    .row { margin-bottom: 10px; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    button { width: 100%; padding: 9px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; margin-top: 6px; }
    #btnScan { background: #1877f2; color: white; }
    button:disabled { background: #d1d5db; color: #6b7280; cursor: default; }
    #btnStop { background: #fee2e2; color: #b91c1c; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider { position: absolute; inset: 0; background: #d1d5db; border-radius: 22px; transition: .2s; cursor: pointer; display: block; }
    .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #22c55e; }
    input:checked + .slider:before { transform: translateX(18px); }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; margin: 4px 0 2px; cursor: pointer; }
    .chk input { accent-color: #1877f2; }
    #status { font-size: 11px; color: #666; margin-top: 8px; min-height: 28px; line-height: 1.4; }
    .hidden { display: none; }
    .hint { font-size: 10px; color: #999; margin-top: 2px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1 style="display:flex; justify-content:space-between; align-items:center;">WorL Collector
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </h1>

  <div id="controls" class="hidden">
    <div class="row">
      <label>Kata kunci <span style="color:#999">(filter, boleh kosong)</span></label>
      <input type="text" id="keyword" placeholder="mis. ryzen 5 5600, worth, laptop gaming">
    </div>
    <div class="row">
      <label>Maks pertanyaan</label>
      <input type="text" id="maxItems" value="30">
    </div>
    <label class="chk">
      <input type="checkbox" id="checkReplies">
      Cek jawaban (buka tiap permalink &rarr; latency jawaban; jauh lebih lambat)
    </label>

    <button id="btnScan">&#128269; Mulai Scan Feed/Grup</button>
    <div class="hint">Jalan di tab FB yang sedang aktif. Scroll otomatis + tangkap post pertanyaan worth-it.</div>
  </div>

  <button id="btnStop" class="hidden">Berhenti semua</button>
  <div id="status"></div>
  <div class="hint" style="margin-top:8px;">CSV tersimpan otomatis ke:<br>D:\Projek\WorL\worl-extension\hasil\</div>

  <script src="popup.js"></script>
</body>
</html>
